[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "Public, read-only MCP server for the shared knowledge base (Python/GCP rewrite)"
requires-python = ">=3.13"
dependencies = [
    # MCP server with Streamable HTTP transport.
    "mcp>=1.2.0",
    # Postgres + pgvector access.
    "asyncpg>=0.30.0",
    # Query embeddings for vector search (chunking/indexing is the indexer's job, not here).
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
