name = "personal-knowledge-mcp"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Deploy provenance for verified-deploy.sh (WP-545 Ф5 live cutover attempt, 31.08): without this
# binding env.CF_VERSION_METADATA is undefined, /health returns {ok:true, version:null}, and the
# script's runtime-provenance jq check (.version.id/.version.tag) never matches — every gated
# deploy to this worker fails and rolls back forever. Mirrors the binding already present in the
# public wrangler.toml.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Cut-over target for WP-410 срез-2b Деплой-1 (peer-session 2026-07-01-27): this config points
# the SAME unified codebase (knowledge-mcp) at the EXISTING personal-knowledge-mcp worker. All
# secrets (DATABASE_URL, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, INDICATORS_DATABASE_URL,
# OPENROUTER_API_KEY, ORY_URL, SCOPE_GUARD_MODE) are already bound to this worker and are NOT
# touched by `wrangler deploy` — inherit-secrets cut-over, no `wrangler secret put` needed.
# MCP_MODE=private is set separately via `wrangler secret put MCP_MODE` after this deploy.
[vars]
KNOWLEDGE_DB_SCHEMA = "knowledge"

# Деплой-2 группа Б (peer-session 2026-07-01-34): consumer/producer live — the queue and its
# DLQ already exist in the account (verified via `wrangler queues info`, both created 2026-04-18).
[[queues.producers]]
queue = "reindex"
binding = "REINDEX_QUEUE"
[[queues.consumers]]
queue = "reindex"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "reindex-dlq"

# Деплой-2 группа В (peer-session 2026-07-03-11): watchdog cron live. 15 min (not 5) —
# handleWatchdog does one cheap conditional UPDATE, no need to fire 288x/day against an
# empty table. Stale-job threshold tuned to 30 min to match (see reindex.ts).
[triggers]
crons = ["*/15 * * * *"]
