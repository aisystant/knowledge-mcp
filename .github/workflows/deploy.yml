name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - name: Run TypeScript tests
        run: npm run test
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Enforce public-data privacy boundary
        run: npm run guard:privacy
      - name: Deploy (verified)
        run: bash scripts/verified-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # WP-545 Ф5: единый канонический путь деплоя воркера personal-knowledge-mcp
      # из unified-дерева (завершение cut-over WP-410, АрхГейт WP-7 Ф100 accepted).
      # По умолчанию ВЫКЛЮЧЕНО: включается repo variable PERSONAL_WORKER_DEPLOY_ENABLED=true.
      # Обязательный порядок cut-over (ревью Codex 31.08 — иначе гонка двух репо сохраняется):
      #   1) provision секретов KNOWLEDGE_DATABASE_URL и HEALTH_DATABASE_URL на воркере
      #      (без них unified-сборка падает — verified-deploy откатит, проверка будет красной);
      #   2) ОТКЛЮЧИТЬ автодеплой в репо personal-knowledge-mcp (его Actions деплоит каждый
      #      push в main в тот же воркер);
      #   3) только после 1-2 выставить PERSONAL_WORKER_DEPLOY_ENABLED=true.
      - name: Deploy personal worker (verified)
        if: vars.PERSONAL_WORKER_DEPLOY_ENABLED == 'true'
        run: bash scripts/verified-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERIFIED_DEPLOY_WORKER: personal-knowledge-mcp
          VERIFIED_DEPLOY_CONFIG: wrangler.private.toml
          VERIFIED_DEPLOY_HEALTH_URL: https://personal-knowledge-mcp.aisystant.workers.dev/health
